# GATATA — Pages CMS (GitHub-backed editing only)
media:
  input: media
  output: media
  rename: safe
content:
  - name: artworks
    label: 작품 관리
    type: file
    path: data/artworks.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: 작품 ID (새 작품은 고유한 영문 ID 입력)
        type: string
        required: true
        description: "예: my-character-01. 다른 작품과 중복되지 않게 입력하세요."
      - name: title
        label: 작품 제목
        type: string
        required: true
      - name: category
        label: 카테고리
        type: string
        required: true
        description: "사이트 설정의 카테고리 이름과 동일하게 입력하세요."
      - name: date
        label: "작업 날짜 (예: 2026.11)"
        type: string
      - name: description
        label: 작품 설명
        type: text
      - name: images
        label: 작품 이미지 (여러 장 가능)
        type: image
        list: true
  - name: site
    label: 작가 프로필 · 메인 배너 · 카테고리
    type: file
    path: data/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: 작가 이름
        type: string
      - name: role
        label: 활동 분야
        type: string
      - name: bio
        label: 자기소개
        type: text
      - name: instagram
        label: 인스타그램 URL
        type: string
      - name: email
        label: 연락 이메일
        type: string
      - name: banner
        label: 메인 배너 그림
        type: image
      - name: categories
        label: 갤러리 카테고리 목록
        type: string
        list: true
